<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Everyday Jewellery</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#25211f;background:#f9f6f2}body{margin:0}header{padding:32px 6vw;border-bottom:1px solid #ded8d0}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(34px,5vw,60px);margin:8px 0}p{line-height:1.5}main{max-width:1000px;margin:45px auto;padding:0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}.product{background:white;border:1px solid #e9e1d7;padding:22px;border-radius:12px}.image{display:grid;place-items:center;background:#f0e9e2;height:180px;border-radius:8px;font-size:50px}.image img{width:100%;height:100%;object-fit:cover}button{background:#24201d;color:white;border:0;border-radius:6px;padding:12px 16px;cursor:pointer}button:disabled{background:#aaa;cursor:not-allowed}aside{margin:32px 0;padding:20px;background:white;border:1px solid #e9e1d7;border-radius:12px}small{color:#777}.price{font-weight:700}
</style></head><body><header><small>EVERYDAY JEWELLERY</small><h1>Pieces to wear every day.</h1><p>Simple jewellery. Easy styling.</p></header><main><h2>Shop</h2><div id="products" class="grid">Loading products…</div><aside><h2>Your cart</h2><div id="cart">Your cart is empty.</div><p id="total"></p><button id="checkout" disabled>Secure checkout</button><p id="message" role="status"></p></aside></main><script type="module" src="/app.js"></script></body></html>
